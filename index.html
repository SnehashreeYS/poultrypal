<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4c7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoultryPal">
<title>PoultryPal 🐥</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--cream:#fffaf0;--yellow:#ffe99a;--green:#286b24;--ink:#3d382f;--line:#e8dec3;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}
header{background:linear-gradient(120deg,#fff0b8,#fff8df);padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:10px;border:1px solid #e0c870}
h1{margin:0;font-size:18px;color:#4f3d24}
p{margin:2px 0 0;font-size:11px;color:#7e6d4e}
main{max-width:960px;margin:12px auto;padding:0 12px 60px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.nav button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.nav button.active{background:#e7f3dd;border-color:#b5d49f;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{display:block;font-size:11px;color:#706655;margin-bottom:4px}
.stat strong{font-size:17px;color:var(--ink)}
.btn-action{background:#f3b43f;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#3e2a00}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f0e8d5}
th{background:#fff8df;color:#675739}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="icon-192.png" alt="PoultryPal">
    <div>
      <h1 id="farmTitle">PoultryPal 🐥</h1>
      <p>Farm Operations & Financial Tracker</p>
    </div>
  </div>
  <button class="btn-action" onclick="quickAdd()">＋ Add Record</button>
</header>

<main>
  <div class="nav" id="moduleNav"></div>
  <div id="contentView"></div>
</main>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration:', err));
}

const MODULES = [
  {id:'home', label:'Overview 📊'},
  {id:'chicks', label:'Chicks 🐣'},
  {id:'mortality', label:'Mortality 🪦'},
  {id:'feed', label:'Feed 🌾'},
  {id:'medicine', label:'Medicine 💉'},
  {id:'expenses', label:'Expenses 🧾'},
  {id:'eggs', label:'Eggs 🥚'},
  {id:'sales', label:'Sales 🐔'},
  {id:'income', label:'Other Income 💰'}
];

let activeTab = 'home';
let records = [];

try {
  records = JSON.parse(localStorage.getItem('pp_records') || '[]');
} catch (e) {
  records = [];
}

function save() {
  try {
    localStorage.setItem('pp_records', JSON.stringify(records));
  } catch (e) {}
  render();
}

function renderNav() {
  const nav = document.getElementById('moduleNav');
  if (!nav) return;
  nav.innerHTML = MODULES.map(m => 
    `<button class="${m.id === activeTab ? 'active' : ''}" onclick="switchTab('${m.id}')">${m.label}</button>`
  ).join('');
}

function switchTab(id) {
  activeTab = id;
  render();
}

function computeStats() {
  let bought = 0, died = 0, sold = 0, expense = 0, income = 0;
  records.forEach(r => {
    const q = Number(r.qty) || 0;
    const a = Number(r.amount) || 0;
    if (r.mod === 'chicks') { bought += q; expense += a; }
    if (r.mod === 'mortality') { died += q; }
    if (r.mod === 'sales') { sold += q; income += a; }
    if (r.mod === 'feed' || r.mod === 'medicine' || r.mod === 'expenses') { expense += a; }
    if (r.mod === 'income' || r.mod === 'eggs') { income += a; }
  });
  return { bought, died, sold, live: Math.max(0, bought - died - sold), expense, income, balance: income - expense };
}

function render() {
  renderNav();
  const v = document.getElementById('contentView');
  if (!v) return;

  if (activeTab === 'home') {
    const s = computeStats();
    v.innerHTML = `
      <div class="grid">
        <div class="stat"><small>Chicks Purchased</small><strong>${s.bought} birds</strong></div>
        <div class="stat" style="background:#fff3f0"><small>Mortality</small><strong style="color:#b23b20">${s.died} birds</strong></div>
        <div class="stat"><small>Birds Sold</small><strong>${s.sold} birds</strong></div>
        <div class="stat" style="background:#edf7e8"><small>Live Remaining</small><strong style="color:var(--green)">${s.live} birds</strong></div>
        <div class="stat"><small>Total Expenses</small><strong style="color:#b23b20">₹${s.expense.toLocaleString('en-IN')}</strong></div>
        <div class="stat"><small>Total Revenue</small><strong style="color:var(--green)">₹${s.income.toLocaleString('en-IN')}</strong></div>
        <div class="stat" style="background:${s.balance>=0?'#edf7e8':'#fff3f0'}"><small>Net Profit / Loss</small><strong style="color:${s.balance>=0?'var(--green)':'#b23b20'}">₹${s.balance.toLocaleString('en-IN')}</strong></div>
      </div>
      <h3 style="font-size:15px;margin:16px 0 8px">Recent Farm Records</h3>
      ${renderTable(records.slice(-10).reverse())}
    `;
  } else {
    const filtered = records.filter(r => r.mod === activeTab);
    const modObj = MODULES.find(m => m.id === activeTab) || MODULES[0];
    v.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <h2 style="font-size:16px;margin:0">${modObj.label}</h2>
        <button class="btn-action" onclick="quickAdd('${activeTab}')">＋ Add Entry</button>
      </div>
      ${renderTable(filtered)}
    `;
  }
}

function renderTable(list) {
  if (!list.length) {
    return `<div class="stat" style="text-align:center;padding:20px;color:#7e6d4e">No records yet. Tap <b>＋ Add Record</b> to enter your first item.</div>`;
  }
  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Module</th><th>Note</th><th>Qty</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody>
          ${list.map(r => `
            <tr>
              <td>${r.date || '-'}</td>
              <td><b>${r.mod}</b></td>
              <td>${r.notes || '-'}</td>
              <td>${r.qty || '-'}</td>
              <td>₹${Number(r.amount || 0).toLocaleString('en-IN')}</td>
              <td><button style="border:0;background:none;color:#b23b20;cursor:pointer;font-weight:bold" onclick="deleteRecord('${r.id}')">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function quickAdd(defaultMod) {
  const mod = defaultMod || prompt('Category: chicks, mortality, feed, medicine, expenses, eggs, sales, income', 'chicks');
  if (!mod) return;
  const qty = prompt('Count or quantity (or 0):', '0');
  const amount = prompt('Total cost / revenue in ₹ (or 0):', '0');
  const notes = prompt('Description or batch details:', 'Daily record');
  
  records.push({
    id: String(Date.now()),
    date: new Date().toISOString().slice(0, 10),
    mod: mod.toLowerCase().trim(),
    qty: Number(qty) || 0,
    amount: Number(amount) || 0,
    notes: notes || ''
  });
  save();
}

function deleteRecord(id) {
  if (confirm('Delete this record?')) {
    records = records.filter(r => r.id !== id);
    save();
  }
}

// Initial direct execution
render();
</script>
</body>
</html>
